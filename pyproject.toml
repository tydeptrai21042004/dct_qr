[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corrected-dct-qr-theory-baselines"
version = "1.0.0"
description = "Corrected DCT-QR theory and 16 comparison baselines only"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "Pillow>=10.0", "numba>=0.60", "scikit-image>=0.24", "pandas>=2.2", "opencv-python-headless>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
